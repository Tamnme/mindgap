<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mindgap · chapter</title>
  <link rel="stylesheet" href="app.css">
  <script>try { const t = localStorage.getItem('mindgap-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the chapter</a>
  <header class="topbar">
    <a class="wordmark" href="/">mindgap</a>
    <a id="course-title" class="tb-title" href="course.html">Course</a>
    <nav class="tabs" aria-label="Course">
      <a href="course.html#home" data-view="home">Home</a>
      <a href="course.html#map" data-view="map">Map</a>
      <a href="course.html#sources" data-view="sources">Sources</a>
    </nav>
    <label class="theme"><span class="sr-only">Theme</span>
      <select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
    </label>
  </header>
  <div class="ch-layout">
    <aside class="ch-side" aria-label="Chapters">
      <h2 id="side-layer" class="ch-side-h"></h2>
      <details id="toc-wrap" class="toc-wrap" open>
        <summary>Chapters and sections</summary>
        <nav id="toc"></nav>
      </details>
    </aside>

    <main id="main" class="ch-main" tabindex="-1">
      <header class="ch-head">
        <h1 id="ch-title">Chapter</h1>
        <p id="ch-meta" class="meta"></p>
        <p id="ch-lede" class="ch-lede"></p>
      </header>
      <div id="error" class="notice error hidden" role="alert"></div>
      <article id="article"></article>
    </main>
  </div>

  <button id="tutor-fab" class="tutor-fab" aria-controls="drawer" aria-expanded="false">
    Tutor <span id="tutor-state" class="small"></span><span id="tutor-badge" class="badge hidden"></span>
  </button>

  <aside id="drawer" class="drawer" aria-label="Tutor" inert>
    <header class="drawer-head">
      <strong>Tutor</strong>
      <span class="small muted">Reviews your checkpoint answers. Ask it anything about the chapter.</span>
      <button id="drawer-close" type="button">Close</button>
    </header>
    <div id="drawer-thread" class="drawer-thread" aria-live="polite"></div>
    <form id="ask-form" class="ask-form">
      <textarea id="ask-text" placeholder="Ask about this chapter…" rows="2"></textarea>
      <button class="primary" id="ask-send">Send</button>
    </form>
  </aside>

  <script type="module" src="chapter.js"></script>
</body>
</html>
