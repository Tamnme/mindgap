<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mindgap · lesson</title>
  <link rel="stylesheet" href="app.css">
  <script>try { const t = localStorage.getItem('mindgap-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the lesson</a>
  <header class="topbar">
    <a class="wordmark" href="/">mindgap</a>
    <a id="course-title" class="tb-title" href="course.html">Course</a>
    <nav class="tabs" aria-label="Course">
      <a href="course.html#home" data-view="home">Home</a>
      <a href="course.html#map" data-view="map">Map</a>
      <a href="course.html#sources" data-view="sources">Sources</a>
    </nav>
    <label class="theme"><span>Theme</span>
      <select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
    </label>
  </header>
  <main id="main" class="page" tabindex="-1">
    <header class="page-head">
      <h1 id="title" class="page-title">Lesson</h1>
      <p id="meta" class="meta"></p>
    </header>

    <div id="done-banner" class="done-banner hidden" role="status">
      <span>Lesson complete.</span>
      <a href="course.html">Back to the course</a>
    </div>
    <div id="error" class="notice error hidden" role="alert"></div>

    <div class="wb-layout">
      <section class="panel" aria-label="Tutor">
        <div id="thread" class="thread" aria-live="polite"></div>

        <div id="question" class="question hidden">
          <div id="q-prompt" class="q-prompt"></div>
          <fieldset id="q-options" class="q-options" aria-labelledby="q-prompt"></fieldset>
          <div id="q-free" class="hidden">
            <textarea id="q-text" placeholder="Your answer"></textarea>
          </div>
          <div id="q-confidence" class="conf hidden" role="group" aria-label="Confidence, 1 guessing to 5 certain">
            <span>Confidence</span>
            <span class="conf-end">1 guessing</span>
            <span id="conf-buttons" class="conf-buttons"></span>
            <span class="conf-end">5 certain</span>
          </div>
          <textarea id="reasoning" placeholder="Think out loud: why do you think that?" style="margin-top:6px"></textarea>
        </div>

        <div class="actions-row">
          <button id="btn-submit" class="primary" disabled>Submit</button>
          <button id="btn-lost">I'm lost</button>
          <button id="btn-ask">Ask something else</button>
          <span id="waiting" class="small muted hidden"><span class="spinner"></span>Tutor is thinking… <span id="elapsed"></span> <button id="btn-cancel" type="button">Cancel</button></span>
        </div>
        <form id="ask-box" class="ask-box hidden">
          <label for="ask-input" class="small muted">What would you like to ask the tutor?</label>
          <div class="ask-row">
            <input id="ask-input" type="text" autocomplete="off">
            <button id="ask-send" class="primary" type="submit" disabled>Ask</button>
            <button id="ask-cancel" type="button">Cancel</button>
          </div>
        </form>
        <div id="turn-error" class="notice error hidden" role="alert">
          <span id="turn-error-text"></span>
          <button id="btn-retry">Retry</button>
        </div>
      </section>

    </div>
  </main>
  <script type="module" src="lesson.js"></script>
</body>
</html>
