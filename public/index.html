<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mindgap · courses</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main style="padding: 16px; max-width: 900px; margin: 0 auto;">
    <header style="margin-bottom: 12px;">
      <h1>mindgap · courses</h1>
      <p class="muted small">Pick a course to open its map.</p>
    </header>
    <div id="error" class="notice error hidden" role="alert"></div>
    <ul id="courses"></ul>
  </main>
  <script type="module">
    const list = document.getElementById('courses');
    const showError = (msg) => {
      const box = document.getElementById('error');
      box.textContent = msg;
      box.classList.toggle('hidden', !msg);
    };
    try {
      const res = await fetch('/api/courses');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const courses = await res.json();
      // One course: skip the list entirely.
      if (courses.length === 1) {
        location.replace(`map.html?course=${encodeURIComponent(courses[0].slug)}`);
      } else if (!courses.length) {
        showError('No courses found. Add one under courses/.');
      } else {
        for (const c of courses) {
          const a = document.createElement('a');
          a.href = `map.html?course=${encodeURIComponent(c.slug)}`;
          a.textContent = c.title || c.slug;
          const li = document.createElement('li');
          li.append(a);
          list.append(li);
        }
      }
    } catch (err) {
      showError(`Could not load courses: ${err.message}`);
    }
  </script>
</body>
</html>
