<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mindgap · courses</title>
  <link rel="stylesheet" href="app.css">
  <script>try { const t = localStorage.getItem('mindgap-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <a class="skip-link" href="#index">Skip to your courses</a>
  <header class="topbar">
    <a class="wordmark" href="/">mindgap</a>
    <span class="tb-spacer"></span>
    <label class="theme"><span>Theme</span>
      <select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
    </label>
  </header>
  <main class="index" id="index" tabindex="-1">
    <section class="courses" aria-labelledby="courses-heading">
      <h1 id="courses-heading" class="page-title">Your courses</h1>
      <div id="error" class="notice error hidden" role="alert"></div>
      <ul id="courses" class="course-list"></ul>
    </section>
    <section class="new-course" aria-labelledby="new-heading">
      <h2 id="new-heading" class="new-heading">Start a new course</h2>
      <p class="lede">Tell it what you want to learn. It probes what you already know, then teaches the gaps.</p>
      <form id="new-course">
        <p><label for="title">What do you want to learn?</label>
          <input id="title" type="text" name="title" required maxlength="80" placeholder="e.g. Kubernetes networking"></p>
        <p><label for="background">Background</label>
          <textarea id="background" name="background" maxlength="2000" rows="4" aria-describedby="bg-help"></textarea>
          <span id="bg-help" class="muted small">Optional. What you already know or have used, so the first questions start at the right level.</span></p>
        <button type="submit" class="primary" id="create">Create course</button>
      </form>
    </section>
  </main>
  <script type="module">
    import { statusMark } from './chrome.js';

    const list = document.getElementById('courses');
    const ORDER = ['solid', 'shaky', 'gap', 'untested'];
    const showError = (msg) => {
      const box = document.getElementById('error');
      box.textContent = msg;
      box.classList.toggle('hidden', !msg);
    };
    const el = (tag, cls, text) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    };
    // One row per course: title, where to pick up, a strip with one mark per topic, and the counts in words.
    const courseItem = (c) => {
      const q = encodeURIComponent(c.slug);
      const li = el('li', 'course');
      const title = el('a', 'course-title', c.title || c.slug);
      title.href = `course.html?course=${q}`;
      const counts = c.counts || { solid: c.solid, untested: c.total - c.solid };
      const strip = el('div', 'course-strip');
      strip.setAttribute('aria-hidden', 'true');
      for (const s of ORDER) for (let i = 0; i < (counts[s] || 0); i++) strip.append(statusMark(s, 'sm'));
      const meta = el('p', 'course-meta num');
      if (c.total) {
        meta.append(el('b', null, String(counts.untested || 0)), ` of ${c.total} untested · ${counts.solid || 0} solid · ${counts.shaky || 0} shaky · ${counts.gap || 0} gap`);
      } else {
        meta.textContent = 'No map yet. Open it to set a goal.';
      }
      const l = c.lastLesson;
      const go = el('a', 'button course-go', l ? `Resume: ${l.title}` : 'Open');
      go.title = go.textContent;
      go.href = !l ? `course.html?course=${q}`
        : l.mode === 'chapter' ? `chapter.html?course=${q}&node=${encodeURIComponent(l.nodeId)}`
        : `lesson.html?course=${q}&id=${encodeURIComponent(l.id)}`;
      li.append(title, go, strip, meta);
      return li;
    };
    try {
      const res = await fetch('/api/courses');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const courses = await res.json();
      document.getElementById('index').classList.toggle('has-courses', courses.length > 0);
      for (const c of courses) list.append(courseItem(c));
    } catch (err) {
      showError(`Could not load courses: ${err.message}`);
    }

    document.getElementById('new-course').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('create');
      showError('');
      btn.disabled = true;
      try {
        const res = await fetch('/api/courses', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ title: e.target.title.value.trim(), background: e.target.background.value }),
        });
        let body = null;
        try { body = await res.json(); } catch { /* no JSON body */ }
        if (res.status !== 201) throw new Error((body && body.error) || `HTTP ${res.status}`);
        location.href = `course.html?course=${encodeURIComponent(body.slug)}`;
        return;
      } catch (err) {
        showError(err.message);
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
